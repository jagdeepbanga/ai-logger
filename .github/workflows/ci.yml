name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` runs the prepare script, which builds both halves — so this
      # also proves a fresh install of the package produces a working CLI.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: The built CLI runs
        run: node dist/cli.js --help
