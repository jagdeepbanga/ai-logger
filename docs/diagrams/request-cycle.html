<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How AI Logger records a turn</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>How AI Logger records a turn</h1>

    <svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="request-cycle-title request-cycle-desc">
      <title id="request-cycle-title">How AI Logger records a turn</title>
      <desc id="request-cycle-desc">Sequence diagram: ai-logger starts a loopback proxy and spawns Claude Code with ANTHROPIC_BASE_URL pointing at it, forwards each request to the Anthropic Messages API with the auth header intact, streams the response straight back to the agent unbuffered, and afterwards writes a redacted copy of the exchange to the recordings directory.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Lifelines ============ -->
      <line x1="120" y1="112" x2="120" y2="544" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="360" y1="112" x2="360" y2="544" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="640" y1="112" x2="640" y2="544" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="860" y1="112" x2="860" y2="544" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ============ Activation bars ============ -->
      <!-- ai-logger holds control for the whole session -->
      <rect x="356" y="164" width="8" height="368" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- claude is alive from spawn until the turn ends -->
      <rect x="116" y="196" width="8" height="272" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- the API holds control only while generating -->
      <rect x="636" y="328" width="8" height="64" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- the store is touched once, after the response is delivered -->
      <rect x="856" y="512" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ============ Messages (drawn before boxes) ============ -->

      <!-- 0. spawn — async, open arrowhead -->
      <line x1="356" y1="180" x2="128" y2="180" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="212" y="160" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPAWN</text>
      <rect x="148" y="188" width="196" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="197" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ANTHROPIC_BASE_URL=127.0.0.1:PORT</text>

      <!-- 1. the agent's request -->
      <line x1="128" y1="264" x2="352" y2="264" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="196" y="244" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="253" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /MESSAGES</text>
      <rect x="168" y="272" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="281" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">system · tools · history</text>

      <!-- 2. forwarded upstream, untouched -->
      <line x1="368" y1="328" x2="632" y2="328" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="464" y="308" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="317" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD AS-IS</text>
      <rect x="440" y="336" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="345" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">your auth header intact</text>

      <!-- 3. the model's response — return, dashed + filled marker -->
      <line x1="632" y1="392" x2="368" y2="392" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <rect x="468" y="372" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="381" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SSE STREAM</text>

      <!-- 4. headline success — straight back to the agent -->
      <line x1="352" y1="448" x2="128" y2="448" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="196" y="428" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="437" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STREAMED BACK</text>
      <rect x="160" y="456" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="465" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">unbuffered, chunk by chunk</text>

      <!-- 5. the copy — async, never blocks the turn. Label sits clear of the API lifeline. -->
      <line x1="368" y1="512" x2="852" y2="512" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="720" y="492" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="752" y="501" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE COPY</text>
      <rect x="664" y="520" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="752" y="529" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">generation calls · secrets redacted</text>

      <!-- ============ Actors ============ -->

      <!-- claude -->
      <rect x="48" y="56" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="56" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="56" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="70" y="73" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="120" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude Code</text>
      <text x="120" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude</text>

      <!-- ai-logger — the one focal actor -->
      <rect x="288" y="56" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="56" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="296" y="64" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="314" y="73" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>
      <text x="360" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Logger</text>
      <text x="360" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:PORT</text>

      <!-- the API -->
      <rect x="568" y="56" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="56" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="576" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="590" y="73" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="640" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Messages API</text>
      <text x="640" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api.anthropic.com</text>

      <!-- the recordings -->
      <rect x="788" y="56" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="788" y="56" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="796" y="64" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="812" y="73" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
      <text x="860" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Recordings</text>
      <text x="860" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~/.ai-logger</text>

      <!-- ============ Editorial aside ============ -->
      <text x="48" y="576" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Only a copy is kept — the agent behaves exactly as it would without the proxy.</text>

      <!-- ============ Legend ============ -->
      <line x1="32" y1="596" x2="928" y2="596" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="120" y1="616" x2="144" y2="616" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="156" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CALL</text>

      <line x1="260" y1="616" x2="284" y2="616" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <text x="296" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RETURN</text>

      <line x1="416" y1="616" x2="440" y2="616" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="452" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RESPONSE TO THE AGENT</text>

      <line x1="676" y1="616" x2="700" y2="616" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="712" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ASYNC — NEVER BLOCKS THE TURN</text>
    </svg>
  </div>
</body>
</html>
